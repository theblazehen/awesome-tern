# The source for README.md. Add or change entries here, then open a pull request;
# README.md is regenerated after merge. See CONTRIBUTING.md.
#
# Sections are sorted by GitHub stars unless they say `sort: manual`.
# Every entry needs a `kind`; see CONTRIBUTING.md for the kinds and where things go.

title: Awesome Tern
tagline: Plugins, apps, tools and resources for [Tern](https://stencil.so/tern), Stencil's terminal.
intro: |-
  Tern is a Rust-native terminal from [Stencil](https://stencil.so). Shells, [omp](https://omp.sh) agents and browser panes keep running in a daemon when the window closes, and come back after a reboot. One session can be open on the desktop app, on iOS and in a WebGPU browser tab at the same time; typing in one shows up in the others. `tern remote serve` serves a remote machine's sessions over QUIC.

  Tern is in closed beta; request access through the [waitlist](https://auth.stencil.so/waitlist?app=tern), and join the discussion in the [omp Discord](https://discord.gg/4NMW9cdXZa).

  Plugins are written in Luau and installed with `tern plugin install github.com/OWNER/REPO` (see the [plugin CLI reference](https://docs.stencil.so/tern/reference/cli.html)). Apps are standalone programs that draw their own UI in a Tern pane over the Tern Surface Protocol (TSP); install them as their README describes.
contributing: Suggestions are welcome as pull requests. Read the [contribution guidelines](CONTRIBUTING.md) first.
sections:
- title: Agents
  blurb: Coding agents that draw natively in Tern, extensions that make agents Tern-aware, and plugins for watching and steering them.
  sections:
  - title: Coding agents
    entries:
    - name: codex-tern
      url: https://github.com/juniorxxue/codex-tern
      kind: app
      description: Unofficial Codex GUI that talks to the official `codex app-server` and draws its interface natively in Tern, keeping your existing Codex login and config.
    - name: oh-my-pi (omp)
      url: https://github.com/can1357/oh-my-pi
      kind: app
      description: Stencil's coding agent that Tern is built around, drawing its transcript and UI natively, restoring sessions, and opening web pages as browser picture-in-picture panes.
    - name: Octet
      url: https://github.com/skaft-software/octet/pull/485
      kind: app
      description: Coding-agent shell rendering transcript cards, split diffs, pickers, and reports through TSP; Tern support is merged into the integration branch for 0.8.2 but not in the latest 0.8.1 release.
      repo: skaft-software/octet
    - name: Hermes for Tern
      url: https://github.com/thefullctx/hermes-for-tern
      kind: app
      description: Unofficial Tern frontend for Hermes Agent that draws the conversation, tool rows, subagents, buttons and a docked composer natively over TSP, and leaves the normal Hermes interface alone in other terminals.
    - name: tern-agents-ui
      url: https://github.com/saanuregh/tern-agents-ui
      kind: app
      description: Native chat frontends for Claude Code (`tclaude`) and Codex (`tcodex`) that draw the conversation, tool cards, subagents, plans, permission prompts and a composer with model, effort and context chips over TSP, and report agent status to Tern's attention inbox.
    - name: saavy
      url: https://github.com/saavy1/saavy_cloud
      kind: app
      description: Persistent coding agent on Cloudflare with a native TSP frontend in Tern and a `pi-tui` fallback elsewhere.
  - title: Agent extensions
    blurb: These run inside your coding agent rather than inside Tern.
    entries:
    - name: hermes-tern
      url: https://github.com/alt-glitch/hermes-tern
      kind: extension
      description: Hermes Agent plugin that adds `hermes tern`, drawing the transcript, tool cards, approvals, subagents and pull requests as native Tern UI.
    - name: tern-omp-bridge
      url: https://github.com/theblazehen/tern-omp-bridge
      kind: extension
      description: Gives omp agents a `tern_exec` tool that runs Luau in the live Tern window to inspect and control it and to show native tables, charts and buttons.
    - name: tern-omp-vimnav
      url: https://github.com/DinMon/tern-omp-vimnav
      kind: extension
      description: Vim-style navigation of the omp transcript in Tern, with block cursor, text selection and copying, search and Vimium-style hints for links, code blocks and buttons.
    - name: tern-control
      url: https://github.com/wolfiesch/tern-control
      kind: extension
      description: An omp and Pi extension giving agents tools to find Tern sessions, read transcript digests, follow daemon events, change layout, and type into terminals.
    - name: tern-mcp
      url: https://github.com/NaC-L/tern-mcp
      kind: extension
      description: Python MCP server over stdio wrapping the tern CLI with 14 tools for sessions, panes, capture, process inspection, input and layout.
    - name: omp-side
      url: https://github.com/wolfiesch/omp-side
      kind: extension
      description: Adds a `/side` command to fork the conversation into a child session and open it in a side pane in Tern, cmux, tmux, WezTerm, Kitty, and Ghostty.
    - name: omp-thinking-translator
      url: https://github.com/Mouriya-Emma/omp-thinking-translator
      kind: extension
      description: An omp extension that translates visible thinking into collapsible native sections in Tern and plain ANSI output in other terminals.
    - name: pi-tern
      url: https://github.com/Ghost-9/pi-tern
      kind: extension
      description: Makes the pi coding agent Tern-aware with the TSP handshake, native Mermaid diagrams, browser automation, pane capture and a session mirror.
    - name: omp-stretch
      url: https://github.com/materemias/omp-stretch
      kind: extension
      description: Shows each omp reply in Tern as its gist, with linked phrases that grow their detail in place when clicked, and tells the model which parts you opened.
  - title: Usage and quotas
    entries:
    - name: tern-omp-usage-dashboard
      url: https://github.com/wolfiesch/tern-omp-usage-dashboard
      kind: plugin
      description: Native pane of omp provider quotas for every account, with remaining bars, reset countdowns and explicit login, stale and no-data states.
    - name: tern-plugins (Emirfs)
      url: https://github.com/Emirfs/tern-plugins
      kind: plugin
      description: Collection with a pane of remaining limits for every account across omp profiles, a display of which omp profile each pane runs, and a split-columns layout helper.
    - name: omp-cache-meter
      url: https://github.com/andreiverdes/omp-cache-meter
      kind: extension
      description: Prompt-cache meter for omp with hits, writes and an expiry countdown, plus a Tern plugin that adds a status-line segment, tab countdowns and a toast before the cache goes cold.
    - name: tern-ai-limits
      url: https://github.com/pfTheTrial/tern-ai-limits
      kind: plugin
      description: Side-column panel showing every usage window of your AI coding plans as a ring with its reset countdown, covering Claude, Codex, Cursor, Grok and anything omp tracks.
    - name: tern-omp-stats
      url: https://github.com/BaLaurent/tern-omp-stats
      kind: plugin
      description: Dashboard block built from native components that turns the usage statistics in `~/.omp/stats.db` into per-model and per-project tables with cost.
    - name: tern-model-usage
      url: https://github.com/azmifarih/tern-model-usage
      kind: plugin
      description: Shows omp coding-plan quota for each signed-in account in the status line and opens a canvas pane with provider cards and reset countdowns.
    - name: tern-usage-monitor
      url: https://github.com/rico-vz/tern-usage-monitor
      kind: plugin
      description: Floating or docked panel showing usage for every omp linked account, with per-account quota bars, auto-refresh, ordering and update-time settings.
    - name: tern-claude-usage
      url: https://github.com/zerx-lab/tern-claude-usage
      kind: plugin
      description: Shows Claude Pro and Max usage limits in a panel and a status-line segment, with 5-hour and 7-day windows, per-model limits, pace tracking and reset countdowns.
    - name: CodexBar AgentView
      url: https://github.com/materemias/codexbar-agentview
      kind: plugin
      description: Shows Claude, Codex and other AI provider usage from the CodexBar CLI in the status line, with a dashboard that lists live and ended Claude Code, Codex, omp and pi sessions and focuses or resumes them in Tern tabs.
    - name: tern-omp-usage
      url: https://github.com/joaodutra88/tern-omp-usage
      kind: plugin
      description: Shows Claude and Codex limits from omp in the status line as colored dots, with a work-week budget, alerts, a 7-day usage and cost dashboard and one-click updates.
    - name: tern-plugin-omp-usage
      url: https://github.com/jmazzola/tern-plugin-omp-usage
      kind: plugin
      description: Shows omp usage limits above the composer's context bar, with a meter, reset countdown and clock time for each window on hover.
    - name: tern-minimax-quota
      url: https://github.com/meisijiya/tern-minimax-quota
      kind: plugin
      description: Shows your MiniMax Token Plan quota in the status line and refreshes it every five minutes.
  - title: Status and dashboards
    entries:
    - name: tern-t3
      url: https://github.com/rcnsh/tern-t3
      kind: plugin
      description: Reads, starts and replies to T3 Code agent threads in native Tern blocks.
    - name: tern-omp-trajectory
      url: https://github.com/Ahaxzh/tern-omp-trajectory
      kind: plugin
      description: Turns omp session logs into a native trajectory viewer with a turn-grouped call ledger, per-entry inspectors and a token timeline.
    - name: Agents Hub
      url: https://github.com/plxzy/agents-hub/tree/main/plugins/tern-agents-hub
      kind: plugin
      description: Side panel for a self-hosted Agents Hub that lists Pi agent runs with status, cost and pull request, lets you accept or reject pending reviews, and adds a status-line count.
      repo: plxzy/agents-hub
    - name: omp Tiles
      url: https://github.com/MrsKugla/omp-tiles-plugin
      kind: plugin
      description: Block with one colored tile per open omp session across all Tern sessions, showing the session title and whether it is working, waiting for you or idle.
    - name: tern-periscope
      url: https://github.com/kenXengineering/tern-periscope
      kind: plugin
      description: Lists the subagents of an omp session with live status, tool counts and cost, and opens any transcript as it is written.
    - name: tern-software-factory
      url: https://github.com/junaidrahim/tern-software-factory
      kind: plugin
      description: Lists the agents on your Tern host and jumps to the pane of the one you select.
    - name: tern-claude-workflows
      url: https://github.com/cgasgarth/tern-claude-workflows
      kind: plugin
      description: Side block that follows the Claude Code workflows of the session in its tab, with phase timelines, an agent tree with model, tokens, tools and idle time, and a table of past workflows; it also works for ACP chats, which do not show workflow progress.
    - name: tern-tab-status
      url: https://github.com/yoyooyooo/tern-tab-status
      kind: plugin
      description: Colors tabs by whether their omp and pi sessions are working, waiting or need your attention.
    - name: tern-agent-progress
      url: https://github.com/Sipty/tern-agent-progress
      kind: plugin
      description: Marks tabs that run omp agents with WoW-style quest marks and todo progress bars.
  - title: Orchestration
    entries:
    - name: tern-dsh-web
      url: https://github.com/meisijiya/tern-dsh-web
      kind: plugin
      description: Starts the DeepSeek Harness web UI on demand from a status-bar menu and opens it in a browser block, with restart, stop and update actions.
    - name: tern-swarm
      url: https://github.com/bmanturner/tern-swarm
      kind: plugin
      description: Kanban board that runs omp agents on its cards in separate git worktrees, runs your checks on their work and waits for your approval.
    - name: tern-agent-scheduler
      url: https://github.com/bmanturner/tern-agent-scheduler
      kind: plugin
      description: Schedules omp agent runs with cron, presets, plain-English or one-shot times, starts each in a background tab and keeps their results, failures and costs in a manager block, with status-line, notification and Carly support.
    - name: tern-agents
      url: https://github.com/maxtuzz/tern-agents
      kind: plugin
      description: Runs Claude Code, Codex, Gemini, OpenCode, Aider or any agent CLI as a Tern agent block, with profiles, run presets, a launcher and an Agents sidebar.
    - name: Overseer
      url: https://github.com/mmnavarr/overseer
      kind: plugin
      description: Panel listing every branch in flight with its worktree, agents, pull request and ticket, where each worktree gets its own Tern session.
    - name: Forge Projects
      url: https://github.com/Moti-Velz/tern-forge/tree/main/projects
      kind: plugin
      description: Sidebar for parallel agent work that gives each git worktree its own Tern session, with agent status, pull request and Linear ticket on every row, and one box that opens or creates a worktree from a branch, ticket or pull request.
      repo: Moti-Velz/tern-forge
    - name: tern-task-plugin
      url: https://github.com/yesmeck/tern-task-plugin
      kind: plugin
      description: Makes each task a session with its own branch, git worktree and default agent, with a kanban dashboard of pull request status.
  - title: Worktrees
    entries:
    - name: tern-worktrees
      url: https://github.com/riicodespretty/tern-worktrees
      kind: plugin
      description: Opens git worktrees as Tern tabs with a branch picker and teardown on close, backed by a `tern-wt` CLI and an omp skill for agents.
    - name: tern-worktrees (aliefe04)
      url: https://github.com/aliefe04/tern-worktrees
      kind: plugin
      description: Adds palette commands that create a git worktree on a new branch with an agent tab, and remove the focused worktree only when it is clean and merged into the default branch.
    - name: tern-worktree
      url: https://github.com/nibblebot/tern-worktree
      kind: plugin
      description: Lists, opens and creates git worktrees from the command palette using plain git, with `jq` and a POSIX shell as the only other requirements.
    - name: tern-jj workspaces
      url: https://github.com/plumj-am/nixos/blob/master/packages/tern-plugins/jj.nix
      kind: plugin
      description: Creates, opens, removes, and inspects jj workspaces using Tern dialogs, tabs, and the status line, packaged with Nix inside a NixOS config.
      repo: plumj-am/nixos
    - name: Worktree Panel
      url: https://github.com/mullerino/tern-worktree-panel
      kind: plugin
      description: Pins a panel to every tab that lists the git worktrees of the focused repository with the state of the omp agents in each, moves agents waiting for you to the top, and focuses or opens a worktree's tab on click.
  - title: Notifications and alerts
    entries:
    - name: tern-pushover
      url: https://github.com/larkinwc/tern-pushover
      kind: plugin
      description: Sends Pushover notifications to your phone when an agent needs you or finishes, or a long command ends, while you're away, with an Open Tern button.
    - name: tern-chime
      url: https://github.com/H4vC/tern-chime
      kind: plugin
      description: Plays a configurable sound when a pane raises an unseen alert, an omp agent yields its turn, or a long command finishes, with bundled chimes and per-trigger overrides.
    - name: tern-chirp
      url: https://github.com/Noctivoro/tern-chirp
      kind: plugin
      description: Plays a short synthesized beep when an agent finishes or waits for you, with the sound's shape chosen by Jev to match how the turn went.
    - name: tern-bell
      url: https://github.com/qiaoqinyu/tern-bell
      kind: plugin
      description: Plays configurable sounds when a main agent completes, fails or needs input, with separate completion and failure selections, previewable macOS and custom sounds, and settings saved only on confirmation.
    - name: tern-haptic-alert
      url: https://github.com/lfsmoura/tern-haptic-alert
      kind: plugin
      description: Sends a haptic pulse to a Logitech MX Master 4 when an agent finishes or is blocked waiting for input.
    - name: tern-gpg-touch
      url: https://github.com/edcnogueira/tern-gpg-touch
      kind: plugin
      description: Shows a toast, and optionally plays a sound, when a typed command starts that will wait for a touch on your GPG security key, with per-folder rules.
    - name: tern-desktop-pet
      url: https://github.com/hanbong5938/tern-desktop-pet
      kind: plugin
      description: Connects Tern agent observations and semantic asks to the separately installed Desktop Pet app.
- title: Workspace
  blurb: Sessions, navigation and layout, remote hosts, and how Tern looks.
  sections:
  - title: Sessions and sidebars
    entries:
    - name: workspaces-sidebar
      url: https://github.com/rezhajulio/workspaces-sidebar
      kind: plugin
      description: Pins a workspace sidebar to every tab that lists sessions and their tabs as a tree, with live badges for waiting agents, running and failed commands, one-click switching, tab color tags, and attention-jump keybindings.
    - name: tern-projects
      url: https://github.com/thegeneralist01/tern-projects
      kind: plugin
      description: Curated multi-folder projects, pinned chats, and search across OMP, Claude Code, Codex, Pi, OpenCode, and Cursor.
    - name: tern-omp-groups
      url: https://github.com/vishiod/tern-omp-groups
      kind: plugin
      description: Groups omp chats by the code at the start of their titles and lists every saved chat under its group, reopening a closed one in that group with a click.
    - name: tern-workspaces-sidebar
      url: https://github.com/tobiasesquivel/tern-workspaces-sidebar
      kind: plugin
      description: Sidebar that lists every session as a workspace with nested tabs, git counters and agent state, plus a small runtime that gives omp, Claude Code and Codex the same status.
    - name: tern-plugins (Unravl)
      url: https://github.com/Unravl/tern-plugins
      kind: plugin
      description: Collection with a left sidebar of sessions per host that shows omp agent status, and a fix that keeps the omp composer bar one band when macOS Reduce transparency is on.
    - name: Kai
      url: https://github.com/Yupmoh/tern-plugins/tree/main/kai
      kind: plugin
      description: Workspaces sidebar that shows each session as a card with its agents, files, git changes and branches.
      repo: Yupmoh/tern-plugins
    - name: Flock
      url: https://github.com/Luqueee/flock
      kind: plugin
      description: Groups omp agents, terminals and sessions by project and machine in a native sidebar, and opens an agent's git worktree in VS Code, locally or over SSH.
    - name: tern-agent-nav
      url: https://github.com/Arcadia822/tern-agent-nav
      kind: plugin
      description: Simple session sidebar in the style of Herdr that lists omp, Codex, Copilot and Claude Code agents grouped by Tern session, with a click to focus one.
  - title: Navigation, layout and input
    entries:
    - name: tern-ide layout
      url: https://github.com/plumj-am/nixos/blob/master/packages/tern-plugins/layout.nix
      kind: plugin
      description: Window plugin with an IDE-style four-pane layout, set split ratios, and an omp pane, packaged with Nix inside a NixOS config.
      repo: plumj-am/nixos
    - name: tern-tab-search
      url: https://github.com/cgasgarth/tern-tab-search
      kind: plugin
      description: Searches tabs across sessions in a native popup, with `session:tab` filtering and no changes to tab titles or pane layouts.
    - name: tern-close-plugin
      url: https://github.com/yumosx/tern-close-plugin
      kind: plugin
      description: Adds palette commands that close the other tabs and the split blocks left, right and around the focused block, each row hidden while it would close nothing.
    - name: pane-highlight
      url: https://github.com/olegpulatov/pane-highlight
      kind: plugin
      description: Marks the active split with a border and tint, dims the others, and recolors a pane by user or host, such as red for `prod-*` hosts.
    - name: tern-plugins (mreishus)
      url: https://github.com/mreishus/tern-plugins
      kind: plugin
      description: Collection of small plugins, including one that moves the tab bar to the bottom in the tiles, studio and float layouts and one that opens a pane's scrollback in nvim.
    - name: tern-grid-layout
      url: https://github.com/yoyooyooo/tern-grid-layout
      kind: plugin
      description: Arranges the panes of a tab into equal-width columns when the window resizes or on request, keeping manual divider changes in between.
    - name: tern-extrakeys
      url: https://github.com/bneil/tern-extrakeys
      kind: plugin
      description: Termux-style bar of buttons for Esc, Ctrl, Alt, Tab, arrows and more that types into a pane you choose, using Termux's extra-keys config format.
  - title: Integrations
    blurb: Plugins that make Tern fit a setup you already work in, such as a multiplexer, editor, window manager or browser.
    entries:
    - name: herdr-tern-plugin
      url: https://github.com/gabrielmoreira/herdr-tern-plugin
      kind: plugin
      description: Adds an Open Herdr Session command that picks an existing herdr session and attaches to it inside Tern without copying or converting workspaces.
    - name: tern-herdr
      url: https://github.com/safzanpirani/tern-herdr
      kind: plugin
      description: Shows Herdr as native Tern tabs, splits and a sidebar, with tabs colored by agent state and Herdr's prefix keys working.
    - name: tern-vimnav
      url: https://github.com/mayask/tern-vimnav
      kind: plugin
      description: Brings vim-tmux-navigator to Tern so Ctrl+H/J/K/L moves between Neovim splits and Tern panes.
    - name: Forge Omarchy
      url: https://github.com/Moti-Velz/tern-forge/tree/main/omarchy
      kind: plugin
      description: Makes Omarchy's window keys act on Tern panes first and fall through to Hyprland at the edges, in the style of vim-tmux-navigator, with desktop notifications when agents finish or wait for you.
      repo: Moti-Velz/tern-forge
    - name: tern-browser-profiles
      url: https://github.com/ian139/tern-browser-profiles
      kind: plugin
      description: Opens a Chrome, Brave or Edge profile on macOS inside Tern as an isolated browser signed in with that profile's cookies.
    - name: neotern
      url: https://github.com/arg3t/neotern
      kind: app
      description: Neovim drawn as a native Tern surface in the style of Neovide, with a native command palette and picker; alpha and tuned to the author's own dotfiles.
  - title: Remote hosts
    blurb: 'Working across machines: connecting to hosts, and moving files, clipboard images and links between local and remote panes.'
    entries:
    - name: tern-ssh
      url: https://github.com/aancw/tern-ssh
      kind: plugin
      description: An ssh host manager that runs as a Tern pane. It lists the hosts of an ssh config, connects to them, and adds, edits and removes hosts without leaving Tern.
    - name: tern-file-paste
      url: https://github.com/vokativ/tern-file-paste
      kind: plugin
      description: Uploads copied local files from macOS, Linux, and Windows to remote hosts over SSH and inserts their paths into Tern panes.
    - name: remote-image-paste
      url: https://github.com/zyzhou-s-lab/remote-image-paste
      kind: plugin
      description: Uploads a macOS clipboard image to the focused remote host over SSH and pastes the server path into the current pane.
    - name: tern-remote-open
      url: https://github.com/LoneExile/tern-remote-open
      kind: plugin
      description: Opens file links, localhost URLs and OAuth loopback sign-in links from remote ssh panes on your Mac, where the file or port would not otherwise exist.
    - name: tern-paste-image
      url: https://github.com/Microck/tern-paste-image
      kind: plugin
      description: Pastes Windows clipboard screenshots into local or remote Tern terminals with Ctrl+Alt+V, uploading over SSH and inserting the quoted path without pressing Enter.
    - name: tern-remote-paste
      url: https://github.com/jmilldotdev/tern-remote-paste
      kind: plugin
      description: Makes Ctrl+V in an ssh pane upload a Mac clipboard image to the remote host and paste its path for agents such as omp and Claude Code.
  - title: Companion apps
    blurb: Apps that reach Tern's sessions or agents from outside Tern, on the web, a phone or the desktop.
    entries:
    - name: tern-awui
      url: https://github.com/materemias/tern-awui
      kind: companion
      description: Phone and browser web app for the omp agents running in Tern, reached over Tailscale, with sessions grouped by project and two-way control for prompts, questions, model choice, rewind and push notifications.
  - title: Themes and appearance
    entries:
    - name: tern-wide-autocomplete
      url: https://github.com/doyouing/tern-wide-autocomplete
      kind: plugin
      description: Widens omp's native autocomplete menus and lines them up with the composer in Tern's Reader layout.
    - name: omaterm
      url: https://github.com/betizzel/omaterm
      kind: plugin
      description: Matches Tern's background, foreground, window chrome and ANSI colors to your active Omarchy theme.
    - name: font-default
      url: https://github.com/getpipher/font-default
      kind: plugin
      description: Makes the Reset font size command return to your configured size instead of Tern's built-in default.
    - name: tern-mizu
      url: https://github.com/ITSyndicate25/tern-mizu
      kind: plugin
      description: Paints the Mizu Icons VS Code file icon theme over the Files pane, with 893 icons covering 847 file names, 947 extensions and 1457 folder names.
    - name: tern-omp-layout-fixes
      url: https://github.com/0xGREG/tern-omp-layout-fixes
      kind: plugin
      description: Widens omp transcripts to the full pane and adds spacing above the composer, touching only omp session surfaces.
    - name: tern-vscode-dark
      url: https://github.com/ITSyndicate25/tern-vscode-dark
      kind: plugin
      description: Paints Tern with VS Code's Dark Modern theme, covering window chrome, terminal colors and the file editor's syntax colors.
    - name: tern-kami
      url: https://github.com/justdoswift/tern-kami
      kind: plugin
      description: Warm-paper theme with parchment backgrounds, ink-blue accents and serif type, inspired by Kami.
    - name: tern-custom-background
      url: https://github.com/naraaalt/tern-custom-background
      kind: plugin
      description: Puts a dithered picture behind the whole window, with a settings page to pick the image and how it is drawn.
  - title: Localization
    entries:
    - name: tern-zh-cn
      url: https://github.com/maicent/tern-zh-cn
      kind: plugin
      description: Partial Simplified Chinese translation with Chinese titles for over 50 built-in palette commands and CSS replacement of the palette tabs and tab-bar buttons.
- title: Development
  blurb: Version control, code review, issues and tasks, and tools for files, infrastructure and data.
  sections:
  - title: Git
    entries:
    - name: tern-jj
      url: https://github.com/resYuto/tern-jj
      kind: plugin
      description: Displays `jj status` and `jj st` output as a read-only native card with added, modified and deleted files colored to match the Tern theme.
    - name: tern-jj-diff
      url: https://github.com/zsxawerdu/tern-jj-diff
      kind: plugin
      description: Renders `jj diff` and `jj show` output as a native view with summary badges and one collapsible section per file, filling the gap left by Tern's built-in `jj st` and `jj log` views.
    - name: TernGitButler
      url: https://github.com/edheltzel/GitButler-for-Tern
      kind: plugin
      description: GitButler workspaces in Tern, with a status-bar segment, a workspace block with one lane per branch stack and a diff block.
  - title: Review and feedback
    entries:
    - name: Tern Reviewr
      url: https://github.com/AxelMrak/tern-reviewr
      kind: plugin
      description: Reviews staged, unstaged, and untracked Git changes in a native Tern diff view, sends line-anchored comments directly to an agent, and tracks per-file review progress.
    - name: PR Guide
      url: https://github.com/jubbydev/tern-pr-guide
      kind: plugin
      description: Walks through a GitHub pull request one change at a time with the code beside a plain explanation, then lets you comment and post a single review.
    - name: tern-pr-tour
      url: https://github.com/lfsmoura/tern-pr-tour
      kind: plugin
      description: Step-by-step tours of a pull request that can answer questions inline, with a matching pr-tour agent skill.
    - name: tern-difftastic
      url: https://github.com/MicroProofs/tern-difftastic
      kind: plugin
      description: Reviews jj and git changes as difftastic's structural side-by-side diffs in a block, with search across both sides of every file and seen and reviewed marks on hunks that survive rebases.
    - name: tern-annotate
      url: https://github.com/hyper-stition/tern-annotate
      kind: plugin
      description: Prototype for commenting on a snapshot of any block and sending the edit comments to an agent in batches.
    - name: tern-margin
      url: https://github.com/Noctivoro/tern-margin
      kind: app
      description: Renders a Markdown file block by block so you can leave CriticMarkup comments on any paragraph, list, table or code block, and hands them back to the agent that opened it.
  - title: Issues and tasks
    entries:
    - name: tern-tracker
      url: https://github.com/foxzool/tern-tracker
      kind: plugin
      description: Lists the GitHub issues and pull requests of the repository in the focused pane's directory, with comments and a form for creating issues, in English or Chinese.
    - name: tern-todo
      url: https://github.com/deLiseLINO/tern-todo
      kind: plugin
      description: Task manager with tasks linked to terminal panes and agent sessions, kept in a JSON file and installable on remote hosts.
    - name: jira-tern
      url: https://github.com/hanbong5938/jira-tern
      kind: plugin
      description: Native Jira browser that reads and posts issue comments, runs status transitions, and opens a Git worktree or jj workspace with an omp agent tab for an issue.
    - name: tern-kata
      url: https://github.com/Dangerboi/tern-kata
      kind: app
      description: Browses and edits kata issues in a native pane opened with F9 or the palette, with Markdown issue bodies, priority and label chips, and kata links from agent chat that open the issue.
  - title: File viewers and notebooks
    entries:
    - name: tern-video-block
      url: https://github.com/verticalrectangle/tern-video-block
      kind: plugin
      description: Opens video files in a block with mpv sound, frame stepping and synced side-by-side playback using ffmpeg and the kitty graphics protocol.
    - name: tern-office-preview
      url: https://github.com/zerx-lab/tern-office-preview
      kind: plugin
      description: Previews Word and Excel files natively in a block using a Rust renderer, with no Office, browser or LibreOffice involved.
    - name: tern-pencil-preview
      url: https://github.com/SamuelFontess/tern-pencil-preview
      kind: plugin
      description: Previews pen.dev (Pencil) `.pen` designs in a block, rendering every top-level frame in one pen CLI run into a disk cache so switching frames is instant, with a layer list, an inspector and re-renders on save.
    - name: kedi-tern
      url: https://github.com/kedi-lang/kedi-tern
      kind: plugin
      description: Read-only viewer for `.kedi` files that highlights them in a native Tern editor using tree-sitter, without running the embedded Python.
    - name: tern-rmd
      url: https://github.com/betizzel/tern-rmd
      kind: plugin
      description: Opens R Markdown files as notebooks, running chunks in one live R session with plots and paged data frames shown under each chunk.
    - name: tern-canvas-viewer
      url: https://github.com/iacore/tern-canvas-viewer
      kind: plugin
      description: Opens `.excalidraw` and `.tldraw` drawings as a rendered picture in a block instead of their JSON source.
    - name: tern-csv
      url: https://github.com/taooceros/tern-csv
      kind: plugin
      description: Shows CSV and TSV files as a native keyboard-driven table with a Table and Text switch.
    - name: tern-obsidian
      url: https://github.com/dbydd/tern-obsidian
      kind: plugin
      description: Recognizes Obsidian vaults and opens their notes, Bases and JSON Canvas files in native reader blocks.
  - title: Cloud and data
    entries:
    - name: tern-kube
      url: https://github.com/contrafy/tern-kube
      kind: plugin
      description: Renders `kubectl` output as sortable, filterable native views, with a live Explore block, one-key pod shells and logs, previewed and confirmed changes, and GitOps drift against your manifests.
    - name: tern-grafana
      url: https://github.com/contrafy/tern-grafana
      kind: plugin
      description: Grafana and Prometheus-compatible backends as native blocks for PromQL queries, dashboards, alerts and silences, logs and traces; pre-release.
    - name: tern-netsuite
      url: https://github.com/contrafy/tern-netsuite
      kind: plugin
      description: Native views for the NetSuite SuiteCloud SDF CLI with a production deploy guard, a project explorer and read-only SuiteQL execution logs and account health; public beta.
    - name: tern-bigquery
      url: https://github.com/junaidrahim/tern-bigquery
      kind: plugin
      description: BigQuery browser built on the `bq` tool, with project search, dataset and table navigation, schema inspection and scrollable data previews.
  - title: System and developer tools
    entries:
    - name: tern-clock
      url: https://github.com/ajaxdude/tern-clock
      kind: plugin
      description: Live system clock in the tab bar, in 12- or 24-hour format with optional seconds and a choice of four positions.
    - name: tern-commands
      url: https://github.com/lucaxic/tern-commands
      kind: plugin
      description: Turns the code blocks in a `COMMANDS.md` file into grouped command buttons.
    - name: tern-nom
      url: https://github.com/tdortman/tern-plugins/tree/main/crates/nom
      kind: app
      description: Shows nix-output-monitor as a live native card with builds, downloads, flake updates and nh's closure diff, and runs the plain program outside Tern.
      repo: tdortman/tern-plugins
    - name: tern-dbgview
      url: https://github.com/Hime7864/tern-dbgview
      kind: plugin
      description: Shows Windows debug output as it is produced, from kernel-mode `DbgPrint` and user-mode `OutputDebugString`.
    - name: tern-ports
      url: https://github.com/meisijiya/tern-ports
      kind: plugin
      description: Shows every listening TCP port on your machine and marks the ones an omp process started.
    - name: tern-find-in-files
      url: https://github.com/jmilldotdev/tern-find-in-files
      kind: plugin
      description: VS Code-style search across the files under a folder, powered by ripgrep, with results updating as you type.
    - name: tern-jobs
      url: https://github.com/eggpeat/tern-jobs
      kind: plugin
      description: Lists your systemd user timers and failed user services in a block with each job's last result and next run, shows the journal of its last run, starts a job on a double `s` press and toasts when a job fails or recovers.
    - name: tern-status
      url: https://github.com/getpipher/tern-status
      kind: plugin
      description: Status line in the style of tmux with CPU, memory, battery, network, disk and clock segments drawn with Tern's own icons and theme tones.
    - name: mantern
      url: https://github.com/theblazehen/mantern
      kind: app
      description: Drop-in `man` replacement that draws pages natively in Tern over TSP, with a synopsis card, option cards, tables, foldable sections and clickable SEE ALSO links, and falls back to the system `man` elsewhere.
    - name: rmon
      url: https://github.com/pgkt04/rmon
      kind: app
      description: Resource monitor for Linux and macOS with CPU, GPU, memory, network, disk and process panels and a disk benchmark, drawn natively in Tern over TSP.
- title: Media and fun
  blurb: Music, games, toys, and whatever doesn't fit anywhere else.
  sections:
  - title: Music and media
    entries:
    - name: Warble
      url: https://github.com/ElkinAMG/tern-warble
      kind: plugin
      description: Spotify player block that controls any Spotify Connect device through the Web API, with cover art, seeking, volume, shuffle, repeat, a device picker and search; macOS only for now.
    - name: tern-spotify (taooceros)
      url: https://github.com/taooceros/tern-spotify
      kind: plugin
      description: Spotify player backed by a librespot daemon that shows up as a Connect device, with your library, album pages and synced lyrics; needs Spotify Premium.
    - name: tern-spotify
      url: https://github.com/rico-vz/tern-spotify
      kind: plugin
      description: Player block for the Spotify desktop app with cover art, playback, seeking and volume controls on macOS, Windows and Linux.
    - name: tern-CDP-tidal
      url: https://github.com/H4vC/tern-CDP-tidal
      kind: plugin
      description: Player block for the TIDAL desktop app, driven over the Chrome DevTools protocol, with cover art, playback, seeking, volume, shuffle, repeat and line-based search.
    - name: tern-spotify (Windows)
      url: https://github.com/NaC-L/tern-spotify
      kind: plugin
      description: Floating player for the Windows Spotify desktop app with cover art, playback controls, search, keyboard shortcuts and the current track in the status line.
    - name: tern-spotify (kyle-elliott)
      url: https://github.com/kyle-elliott/tern-spotify
      kind: plugin
      description: Spotify player pane with album art, queue, library, search and device picker, plus a floating mode, status-line track and palette commands for playback.
  - title: Fun
    entries:
    - name: tern-pokemon
      url: https://github.com/ITSyndicate25/tern-pokemon
      kind: plugin
      description: Ports vscode-pokemon to a block where Pokémon walk, sit and get petted on themed beach, forest and castle scenes, drawn natively with animated GIF sprites and no web view.
    - name: tern-cat
      url: https://github.com/contrafy/tern-cat
      kind: plugin
      description: Adds a pixel-art menace that naps in your panes, swats at your pointer, stares when you sudo and dives through portals when you switch panes.
    - name: Toons
      url: https://github.com/TazeDiB/Toons-Tern
      kind: plugin
      description: Draws cartoons of what the agent is doing while commands run, as a port of claude-toons to Tern's native UI.
    - name: power-surge
      url: https://github.com/dbydd/power-surge
      kind: plugin
      description: Neovim plugin that shows sparks on every text change with a combo meter and screen shake, with a Tern command and chord for it.
    - name: tern-git-fx
      url: https://github.com/willstarnet/tern-git-fx
      kind: plugin
      description: Plays a small pixel-art animation in the pane corner while a git command runs, then a success or failure ending based on its exit status.
    - name: TernMeOn
      url: https://github.com/segmentationf4u1t/Tern-Me-On
      kind: plugin
      description: Controls Buttplug devices from Tern, with haptic patterns written as code and feedback when long commands finish.
    - name: Ternatro
      url: https://github.com/verusferro/Ternatro
      kind: app
      description: Plays Balatro in a Tern pane, running the game's own Lua code from your copy of Balatro.exe and drawing its layout, card motion, particles and shaders natively; you need to own the game.
  - title: Other
    blurb: Plugins and apps that don't fit another section yet.
    entries:
    - name: tern-rss
      url: https://github.com/bmanturner/tern-rss
      kind: plugin
      description: Follows RSS and Atom feeds in a block with expandable previews, articles in a docked reader browser, toasts for starred feeds and a catch-up line instead of an ever-growing unread count.
    - name: tern-pomodoro
      url: https://github.com/tcstacks/tern-pomodoro
      kind: plugin
      description: Minimal timer block with 25-minute focus and 5-minute break defaults, adjustable durations and a quiet progress line, using no network or subprocesses.
    - name: Forge Meetings
      url: https://github.com/Moti-Velz/tern-forge/tree/main/meetings
      kind: plugin
      description: Lists Granola and Fireflies meetings, email threads over IMAP and local transcript exports in one keyboard-driven block, and pastes the ones you pick into the agent's composer as a summary or full transcript.
      repo: Moti-Velz/tern-forge
    - name: Carly Switch
      url: https://github.com/zyzhou-s-lab/carly-switch
      kind: plugin
      description: Switches Carly's native realtime voice between Doubao and OpenAI from a compact panel, including a connection test that does not start the microphone.
    - name: Terngram
      url: https://github.com/d3d0n/terngram
      kind: app
      description: Unofficial keyboard-driven Telegram client built on TDLib and omp's UI toolkit, also installable as a Tern plugin.
- title: Building for Tern
  blurb: Documentation, SDKs and starting points for writing your own Tern plugins and apps.
  sections:
  - title: Documentation
    sort: manual
    entries:
    - name: Tern plugin book
      url: https://docs.stencil.so/tern/
      kind: docs
      description: Official documentation covering host and window runtimes, lenses, blocks, native views, styling, and TSP.
    - name: Getting Started
      url: https://docs.stencil.so/tern/guides/getting-started.html
      kind: docs
      description: Walkthrough of building a lens and palette command, then linking, type-checking, and reloading.
    - name: Command Lenses
      url: https://docs.stencil.so/tern/guides/lenses.html
      kind: docs
      description: Explains how to turn command output into native views using manifest globs and host callbacks.
    - name: Debugging
      url: https://docs.stencil.so/tern/guides/debugging.html
      kind: docs
      description: Covers toasts, logs, Luau typing, handler budgets, and scripted window control.
    - name: Plugin CLI
      url: https://docs.stencil.so/tern/reference/cli.html
      kind: docs
      description: Reference for `tern plugin list`, `install`, `link`, `unlink`, `remove`, `reload`, `dir`, and `types`.
    - name: Tern Surface Protocol
      url: https://docs.stencil.so/tern/protocol/index.html
      kind: docs
      description: Specifies the in-band protocol where CLIs, TUIs, and agents send UI trees that Tern lays out and draws natively.
  - title: SDKs and protocol libraries
    sort: manual
    entries:
    - name: tern-sdk
      url: https://github.com/stencil-hq/tern-sdk
      kind: library
      description: Official repository of Surface Protocol SDKs for Rust, Python, Go and TypeScript, plus the Luau type definitions (`tern.d.luau`) and example plugins.
    - name: '@oh-my-pi/pi-wire'
      url: https://github.com/can1357/oh-my-pi/tree/main/packages/wire
      kind: library
      description: 'TypeScript package implementing the TSP wire format: APC framing, component types, frame operations, handshake and events.'
      repo: can1357/oh-my-pi
    - name: '@oh-my-pi/pi-tui'
      url: https://github.com/can1357/oh-my-pi/tree/main/packages/tui
      kind: library
      description: TypeScript UI toolkit from omp for rendering transcripts, chat, dashboards, and pickers natively over TSP.
      repo: can1357/oh-my-pi
    - name: octet-tern
      url: https://github.com/skaft-software/octet/tree/9e8abda1f4f210d43361b6c0a80e482097feff77/crates/octet-tern
      kind: library
      description: A Rust TSP client built into Octet with wire types, APC chunking, tty flow control, and scene builders.
      repo: skaft-software/octet
  - title: Plugin templates and tooling
    entries:
    - name: tern-plugin-base
      url: https://github.com/olegpulatov/tern-plugin-base
      kind: plugin
      description: Minimal starting point for a Tern plugin to copy, with package, config and dev commands and an example that logs a greeting on load.
- title: Packaging and dotfiles
  blurb: Tern builds are behind a sign-in, so these Nix setups expect you to download the build yourself.
  entries:
  - name: theoparis/nix-tern
    url: https://github.com/theoparis/nix-tern
    kind: config
    description: Nix flake that packages a hand-downloaded Tern tarball and keeps it from being garbage collected.
  - name: pelikanade/flake
    url: https://github.com/pelikanade/flake/blob/f6f8217278a4a119c8e3a5b27b5a30ffef57cbd1/docs/tern.md
    kind: config
    description: Nix packaging guide covering signed-in downloads, `requireFile`, graphics libraries, and updating.
    repo: pelikanade/flake
  - name: plumj-am/nixos
    url: https://github.com/plumj-am/nixos/blob/master/modules/tern.nix
    kind: config
    description: NixOS module that manages Tern settings, theme, tmux-style keybindings, the `omp` launch command and plugins.
    repo: plumj-am/nixos
  - name: tdortman/dotfiles
    url: https://github.com/tdortman/dotfiles/tree/008242f1f3ef305950a98f9878a0253477f256b0/nix
    kind: config
    description: A Nix package with desktop entries, an update script finding new builds via a Stencil browser session, and a KDE Plasma Home Manager module where Meta+Return focuses Tern or starts it.
    repo: tdortman/dotfiles
