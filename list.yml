  sections:
  - title: Documentation
    sort: manual
    entries:
    - name: Tern plugin book
      url: https://docs.stencil.so/tern/
      description: Official documentation covering host and window runtimes, lenses, blocks, native views, styling, and TSP.
    - name: Getting Started
      url: https://docs.stencil.so/tern/guides/getting-started.html
      description: Walkthrough of building a lens and palette command, then linking, type-checking, and reloading.
    - name: Command Lenses
      url: https://docs.stencil.so/tern/guides/lenses.html
      description: Explains how to turn command output into native views using manifest globs and host callbacks.
    - name: Debugging
      url: https://docs.stencil.so/tern/guides/debugging.html
      description: Covers toasts, logs, Luau typing, handler budgets, and scripted window control.
    - name: Plugin CLI
      url: https://docs.stencil.so/tern/reference/cli.html
      description: Reference for `tern plugin list`, `install`, `link`, `unlink`, `remove`, `reload`, `dir`, and `types`.
    - name: Tern Surface Protocol
      url: https://docs.stencil.so/tern/protocol/index.html
      description: Specifies the in-band protocol where CLIs, TUIs, and agents send UI trees that Tern lays out and draws natively.
- title: Packaging
  blurb: Tern builds are behind a sign-in, so most of these packages expect you to download the build yourself.
  entries:
  - name: pelikanade/flake
    url: https://github.com/pelikanade/flake/blob/f6f8217278a4a119c8e3a5b27b5a30ffef57cbd1/docs/tern.md
    description: Nix packaging guide covering signed-in downloads, `requireFile`, graphics libraries, and updating.
    repo: pelikanade/flake
  - name: tdortman/dotfiles
    url: https://github.com/tdortman/dotfiles/blob/008242f1f3ef305950a98f9878a0253477f256b0/nix/packages/tern/default.nix
    description: Nix package with desktop entries and an update script that finds new builds using a Stencil browser session.
    repo: tdortman/dotfiles
  - name: not-matthias/dotfiles-nix
    url: https://github.com/not-matthias/dotfiles-nix/blob/c1c7f09f29c1c938df834427bb96034b2502530e/pkgs/tern.nix
    description: Provides a Nix derivation for x86_64 Linux that uses requireFile and autoPatchelf.
    repo: not-matthias/dotfiles-nix
  - name: phibkro/homelab
    url: https://github.com/phibkro/homelab/blob/1741e8cd636c483dda04ece696d57c1f9efbea9a/src/users/nori/programs/tern/default.nix
    description: Nix package for Tern 0.4.1 that patches graphics and input library paths.
    repo: phibkro/homelab
  - name: install-tern-nixos.sh
    url: https://github.com/4weaver/nixdots/blob/a326859f4ba07920d205b2f88a3fd7af8922d92f/scripts/install-tern-nixos.sh
    description: Shell script that patches the Linux tarball for NixOS and runs `tern remote serve` as a user service on UDP port 8376.
    repo: 4weaver/nixdots
- title: Configs and dotfiles
  entries:
  - name: plumj-am/nixos
    url: https://github.com/plumj-am/nixos/blob/master/modules/tern.nix
    description: NixOS module that manages Tern settings, theme, tmux-style keybindings, the `omp` launch command and plugins.
    repo: plumj-am/nixos
  - name: tdortman Tern launcher
    url: https://github.com/tdortman/dotfiles/blob/008242f1f3ef305950a98f9878a0253477f256b0/nix/modules/home/tern/default.nix
