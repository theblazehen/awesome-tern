# The source for README.md. Add or change entries here, then open a pull request;
# README.md is regenerated after merge. See CONTRIBUTING.md.
#
# Sections are sorted by GitHub stars unless they say `sort: manual`.

title: Awesome Tern
tagline: Plugins, apps, tools and resources for [Tern](https://stencil.so/tern), Stencil's terminal.
intro: |-
  Tern is a Rust-native terminal from [Stencil](https://stencil.so). Shells, [omp](https://omp.sh) agents and browser panes keep running in a daemon when the window closes, and come back after a reboot. One session can be open on the desktop app, on iOS and in a WebGPU browser tab at the same time; typing in one shows up in the others.

  Plugins are written in Luau, and any program can draw native UI through the Tern Surface Protocol (TSP). `tern remote serve` serves a remote machine's sessions over QUIC. Tern is in closed beta; you get in through the [waitlist](https://auth.stencil.so/waitlist?app=tern).
contributing: Suggestions are welcome as pull requests. Read the [contribution guidelines](CONTRIBUTING.md) first.
sections:
- title: Plugins
  blurb: Tern plugins are written in Luau and can be installed directly from GitHub with `tern plugin install github.com/OWNER/REPO`. See the [plugin CLI reference](https://docs.stencil.so/tern/reference/cli.html) for the available commands.
  sections:
  - title: Command lenses
    blurb: A lens captures a shell command's output and shows it as a native view. A Raw toggle shows the original text.
    entries:
    - name: tern-jj
      url: https://github.com/resYuto/tern-jj
      description: Displays `jj status` and `jj st` output as a read-only native card with added, modified and deleted files colored to match the Tern theme.
  - title: Blocks
    entries:
    - name: tern-video-block
      url: https://github.com/verticalrectangle/tern-video-block
      description: Opens video files in a block with mpv sound, frame stepping and synced side-by-side playback using ffmpeg and the kitty graphics protocol.
    - name: tern-spotify
      url: https://github.com/rico-vz/tern-spotify
      description: Player block for the Spotify desktop app with cover art, playback, seeking and volume controls on macOS, Windows and Linux.
  - title: Window and workflow
    blurb: Window plugins add commands, keybindings, layouts, and status-line segments.
    entries:
    - name: tern-model-usage
      url: https://github.com/azmifarih/tern-model-usage
      description: Shows omp coding-plan quota for each signed-in account in the status line and opens a canvas pane with provider cards and reset countdowns.
    - name: herdr-tern-plugin
      url: https://github.com/gabrielmoreira/herdr-tern-plugin
      description: Adds an Open Herdr Session command that picks an existing herdr session and attaches to it inside Tern without copying or converting workspaces.
    - name: tern-ide layout
      url: https://github.com/plumj-am/nixos/blob/master/packages/tern-plugins/layout.nix
      description: Window plugin with an IDE-style four-pane layout, set split ratios, and an omp pane, packaged with Nix inside a NixOS config.
      repo: plumj-am/nixos
    - name: tern-jj workspaces
      url: https://github.com/plumj-am/nixos/blob/master/packages/tern-plugins/jj.nix
      description: Creates, opens, removes, and inspects jj workspaces using Tern dialogs, tabs, and the status line, packaged with Nix inside a NixOS config.
      repo: plumj-am/nixos
  - title: Official examples
    blurb: These examples ship with the official [SDK archive](https://docs.stencil.so/tern/tern-sdk.tar.gz). They are a good starting point if you are writing your own plugin.
    sort: manual
    entries:
    - name: Terraform Plans
      url: https://docs.stencil.so/tern/examples/terraform.html
      description: Lens for `terraform plan` and `tofu plan` that shows badges, diagnostics and resources grouped by action.
    - name: Review Queue
      url: https://docs.stencil.so/tern/examples/review-queue.html
      description: Block that polls `gh` every two minutes and lists pull requests waiting for your review.
    - name: JSON Explorer
      url: https://docs.stencil.so/tern/examples/jsonx.html
      description: Opens JSON and GeoJSON files as collapsible trees and copies the jq path of a node.
    - name: Long-Running Commands
      url: https://docs.stencil.so/tern/examples/longrun.html
      description: Shows a toast when slow commands finish, keeps a history of run times and status, and adds a status-line segment.
    - name: Directory Variables
      url: https://docs.stencil.so/tern/examples/dirvars.html
      description: Loads approved `.tern-env` files into new shells and signals when a directory's environment changed.
    - name: Project Workspaces
      url: https://docs.stencil.so/tern/examples/workspaces.html
      description: Builds named tabs and split panes from `.tern/workspace.json`.
    - name: Canvas Dashboard
      url: https://docs.stencil.so/tern/reference/api-window.html#canvas-cx
      description: Window-only persistent dashboard that shows canvas ownership, keyed patches, and a Refresh action.
- title: Native TSP apps
  blurb: Applications that draw their own user interface natively inside Tern using the Tern Surface Protocol (TSP).
  entries:
  - name: oh-my-pi (omp)
    url: https://github.com/can1357/oh-my-pi
    description: Stencil's coding agent that Tern is built around, drawing its transcript and UI natively, restoring sessions, and opening web pages as browser picture-in-picture panes.
  - name: Terngram
    url: https://github.com/d3d0n/terngram
    description: Unofficial keyboard-driven Telegram client built on TDLib and omp's UI toolkit, also installable as a Tern plugin.
  - name: saavy
    url: https://github.com/saavy1/saavy_cloud
    description: Persistent coding agent on Cloudflare with a native TSP frontend in Tern and a `pi-tui` fallback elsewhere.
  - name: Octet
    url: https://github.com/skaft-software/octet/pull/485
    description: Coding-agent shell that renders transcript cards, split diffs, pickers, and reports through TSP, with Tern support merged into a feature branch, not `main`.
    repo: skaft-software/octet
- title: Agent integrations
  entries:
  - name: tern-control
    url: https://github.com/wolfiesch/tern-control
    description: An omp and Pi extension giving agents tools to find Tern sessions, read transcript digests, follow daemon events, change layout, and type into terminals.
  - name: tern-mcp
    url: https://github.com/NaC-L/tern-mcp
    description: Python MCP server over stdio wrapping the tern CLI with 14 tools for sessions, panes, capture, process inspection, input and layout.
  - name: omp-side
    url: https://github.com/example/test-entry
    description: Adds a `/side` command to fork the conversation into a child session and open it in a side pane in Tern, cmux, tmux, WezTerm, Kitty, and Ghostty.
  - name: omp-thinking-translator
    url: https://github.com/Mouriya-Emma/omp-thinking-translator
    description: An omp extension that translates visible thinking into collapsible native sections in Tern and plain ANSI output in other terminals.
- title: SDKs and protocol libraries
  sort: manual
  entries:
  - name: Tern SDK
    url: https://docs.stencil.so/tern/tern-sdk.tar.gz
    description: Official archive containing Luau type definitions (`tern.d.luau`) and example plugins.
  - name: '@oh-my-pi/pi-wire'
    url: https://github.com/can1357/oh-my-pi/tree/main/packages/wire
    description: 'TypeScript package implementing the TSP wire format: APC framing, component types, frame operations, handshake and events.'
    repo: can1357/oh-my-pi
  - name: '@oh-my-pi/pi-tui'
    url: https://github.com/can1357/oh-my-pi/tree/main/packages/tui
    description: TypeScript UI toolkit from omp for rendering transcripts, chat, dashboards, and pickers natively over TSP.
    repo: can1357/oh-my-pi
  - name: octet-tern
    url: https://github.com/skaft-software/octet/tree/9e8abda1f4f210d43361b6c0a80e482097feff77/crates/octet-tern
    description: A Rust TSP client built into Octet with wire types, APC chunking, tty flow control, and scene builders.
    repo: skaft-software/octet
