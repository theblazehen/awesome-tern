# Sites that block bots or need a sign-in; check these by hand.
exclude = [
  '^https://x\.com/',
  '^https://www\.threads\.com/',
  '^https://discord\.gg/',
  '^https://auth\.stencil\.so/',
  '^https://build\.stencil\.so/',
  '^https://docs\.stencil\.so/tern/tern-sdk\.tar\.gz$',
  '^https://github\.com/m16khb-org/herdr-cwd-sync/',
]
accept = ["200..=299", "429"]
max_retries = 3
timeout = 30
