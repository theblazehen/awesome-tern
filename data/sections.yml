- id: plugins
  title: Plugins
  submittable: false
  children:
  - id: plugins-lenses
    title: Command lenses
    blurb: A lens captures a shell command's output and shows it as a native view. A Raw toggle shows
      the original text.
  - id: plugins-blocks
    title: Blocks
  - id: plugins-window
    title: Window and workflow
    blurb: Window plugins add commands, keybindings, layouts, and status-line segments.
  - id: plugins-examples
    title: Official examples
    sort: manual
    submittable: false
    blurb: These examples ship with the official [SDK archive](https://docs.stencil.so/tern/tern-sdk.tar.gz).
      They are a good starting point if you are writing your own plugin.
  blurb: Tern plugins are written in Luau and can be installed directly from GitHub with `tern plugin
    install github.com/OWNER/REPO`. See the [plugin CLI reference](https://docs.stencil.so/tern/reference/cli.html)
    for the available commands.
- id: apps
  title: Native TSP apps
  blurb: Applications that draw their own user interface natively inside Tern using the Tern Surface Protocol
    (TSP).
- id: agents
  title: Agent integrations
- id: sdks
  title: SDKs and protocol libraries
  sort: manual
- id: official
